[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "f0xtek", email = "f0xtek@pm.me" }]
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib>=2.272.0,<3.0.0",
    "boto3>=1.40.0",
    "constructs>=10.5.0,<11.0.0",
]

[project.scripts]
agent-sandbox = "agent_sandbox:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = ["boto3-stubs[dynamodb]>=1.40.0", "pytest==9.0.3"]
